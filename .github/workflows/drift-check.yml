name: Weekly live drift check

# 8 Nov 2026: proves the live site still matches this repository (the source of truth).
# A failed run means someone changed the live server directly; fix it locally and redeploy.
on:
  schedule:
    - cron: '17 3 * * 1'   # every Monday 08:47 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Compare every deployable file with the live server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python scripts/live-web-drift-audit.py
